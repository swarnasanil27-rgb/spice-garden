<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spice Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5ef;--surface:#fbfcf9;--ink:#16261c;--muted:#5d6d62;--line:#d9e0d4;
  --green:#2c5a3d;--on-green:#f4f8f1;--gold:#d99a00;--veg:#2f8f4e;--nonveg:#c23b2e;--err:#b3261e;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101a14;--surface:#17251c;--ink:#e8efe6;--muted:#9fb0a4;--line:#2a3b30;
  --green:#7fc496;--on-green:#0f1d14;--gold:#f0b429;--veg:#5fcf80;--nonveg:#ef7b6e;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a14;--surface:#17251c;--ink:#e8efe6;--muted:#9fb0a4;--line:#2a3b30;
  --green:#7fc496;--on-green:#0f1d14;--gold:#f0b429;--veg:#5fcf80;--nonveg:#ef7b6e;--err:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
header h1{font-size:1.6rem;color:var(--green)}
.link{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px}
.link:hover{border-color:var(--green)}
main{max-width:1080px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 60px}
.btn{background:var(--green);color:var(--on-green);border:0;border-radius:10px;padding:11px 20px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.muted{color:var(--muted)}
.err{color:var(--err);min-height:1.5em;margin:8px 0 0}
.start{max-width:420px;margin:7vh auto 0}
.start h2{font-size:2.2rem;margin-bottom:6px}
label{display:block;font-weight:500;margin:18px 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.hello{margin-bottom:22px}
.hello h2{font-size:1.7rem}
.cat{margin-bottom:28px}
.cat h3{font-size:1.2rem;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.dish-thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;box-shadow:0 5px 14px rgba(22,38,28,.12);transition:transform .2s}
.item:hover .dish-thumb{transform:scale(1.06) rotate(-2deg)}
.dot{width:14px;height:14px;border:2px solid;border-radius:3px;display:grid;place-items:center;flex:none}
.dot::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.dot.v{color:var(--veg)}.dot.n{color:var(--nonveg)}
.item .info{flex:1;min-width:0}
.item .name{font-weight:500}
.item .sub{font-size:.85rem;color:var(--muted)}
.price{font-variant-numeric:tabular-nums;font-weight:500}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{background:none;border:0;width:30px;height:30px;font-size:1.1rem}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.add{background:none;border:1px solid var(--green);color:var(--green);border-radius:999px;padding:6px 16px;font-weight:700}
.add:hover{background:var(--green);color:var(--on-green)}
aside{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
aside h3{font-size:1.3rem;margin-bottom:12px}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line .rm{background:none;border:0;color:var(--muted);padding:0 4px;font-size:1.1rem}
.line .rm:hover{color:var(--err)}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.sum.total{font-weight:700;font-size:1.15rem;border-top:1px solid var(--ink);margin-top:8px;padding-top:10px}
.actions{display:grid;gap:8px;margin-top:18px}
.pay{display:grid;gap:8px;margin-top:16px}
.status{display:flex;gap:6px;margin:18px 0}
.status div{flex:1;text-align:center;padding:8px 4px;border-radius:8px;border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.status div.on{background:var(--green);color:var(--on-green);border-color:var(--green);font-weight:700}
.empty{color:var(--muted);padding:10px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:.85rem}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.dish-thumb{width:46px;height:46px}}
</style>
</head>
<body>
<header>
  <h1>Spice Garden</h1>
  <button class="link" id="navBtn"></button>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var MAX_TABLES = 10;
  var CATS = [["STARTER","Starter"],["MAIN_COURSE","Main course"],["DESSERT","Dessert"],["DRINK","Drink"]];
  var MENU = [];
  var S = {view:"start", prev:"start", stage:"order", customer:null, orderId:null, bill:null, picks:{}, history:[], current:null, error:""};
  var app = document.getElementById("app"), navBtn = document.getElementById("navBtn");

  // The page contains no ordering logic: every rule (validation, billing, GST,
  // payment, kitchen status) runs in the Java backend and is reached through /api/...
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
  function money(v){return "₹"+Number(v).toFixed(2);}
  function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("show");},1800);}
  function find(id){return MENU.filter(function(m){return m.id===id;})[0];}
  function B(){return S.bill || {lines:[],subtotal:0,gst:0,total:0};}

  function api(url, opts){
    return fetch(url, opts).then(function(r){
      return r.json().catch(function(){return {};}).then(function(d){
        if(!r.ok) throw new Error(d.error || "Request failed.");
        return d;
      });
    }).catch(function(e){
      throw new Error(e && e.message === "Failed to fetch" ? "Cannot reach the server. Please try again." : e.message);
    });
  }
  function form(o){return Object.keys(o).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(o[k]);}).join("&");}
  function post(url,o){return api(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:form(o)});}

  var DISH_IMAGES = {
    1:"public/dishes/paneer-tikka.svg",
    2:"public/dishes/chicken-wings.svg",
    3:"public/dishes/veg-biryani.svg",
    4:"public/dishes/butter-chicken.svg",
    5:"public/dishes/gulab-jamun.svg",
    6:"public/dishes/masala-chai.svg"
  };

  function itemRow(m){
    var q = S.picks[m.id]||1, veg = m.type==="VEG";
    return '<div class="item"><img class="dish-thumb" src="'+(DISH_IMAGES[m.id]||"")+'" alt="'+esc(m.name)+'"><span class="dot '+(veg?'v':'n')+'" title="'+(veg?'Vegetarian':'Non-vegetarian')+'"></span>'+
      '<div class="info"><div class="name">'+esc(m.name)+'</div><div class="sub">'+(veg?'Vegetarian':'Non-vegetarian, spice '+m.spice+'/5')+'</div></div>'+
      '<div class="price">'+money(m.price)+'</div>'+
      '<div class="qty"><button data-act="dec" data-id="'+m.id+'" aria-label="Decrease quantity">−</button><span>'+q+'</span><button data-act="inc" data-id="'+m.id+'" aria-label="Increase quantity">+</button></div>'+
      '<button class="add" data-act="add" data-id="'+m.id+'">Add</button></div>';
  }

  function menuHtml(){
    if(!MENU.length) return '<p class="empty">Loading menu…</p>';
    return CATS.map(function(c){
      var items = MENU.filter(function(m){return m.category===c[0];}).map(itemRow).join("");
      return '<section class="cat"><h3>'+c[1]+'</h3>'+items+'</section>';
    }).join("");
  }

  function totalsHtml(b){
    return '<div class="sum" style="margin-top:12px"><span>Subtotal</span><span>'+money(b.subtotal)+'</span></div>'+
      '<div class="sum"><span>GST (5%)</span><span>'+money(b.gst)+'</span></div>'+
      '<div class="sum total"><span>Total</span><span>'+money(b.total)+'</span></div>';
  }

  function cartHtml(){
    var b = B();
    var body = b.lines.length ? b.lines.map(function(l,i){
      return '<div class="line"><span>'+esc(l.name)+' × '+l.quantity+'</span><span>'+money(l.lineTotal)+
        ' <button class="rm" data-act="rm" data-i="'+i+'" aria-label="Remove '+esc(l.name)+'">×</button></span></div>';
    }).join("") : '<p class="empty">Your order is empty. Add something from the menu.</p>';
    return '<h3>Your order</h3>'+body+totalsHtml(b)+
      '<div class="err" id="cartErr">'+esc(S.error)+'</div>'+
      '<div class="actions"><button class="btn block" data-act="bill">Get bill</button>'+
      '<button class="btn ghost block" data-act="cancel">Cancel order</button></div>';
  }

  function billHtml(){
    var b = B(), c = S.customer;
    return '<h3>Bill · Order #'+b.orderId+'</h3><p class="muted" style="margin:0 0 8px">'+esc(c.name)+', table '+c.table+'</p>'+
      b.lines.map(function(l){return '<div class="line"><span>'+esc(l.name)+' × '+l.quantity+'</span><span>'+money(l.lineTotal)+'</span></div>';}).join("")+
      totalsHtml(b)+
      '<div class="err" id="payErr">'+esc(S.error)+'</div>'+
      '<div class="pay"><span class="muted">Choose a payment method</span>'+
      '<button class="btn block" data-act="pay" data-mode="CASH">Pay with cash</button>'+
      '<button class="btn block" data-act="pay" data-mode="UPI">Pay with UPI</button>'+
      '<button class="btn block" data-act="pay" data-mode="CARD">Pay with card</button>'+
      '<button class="btn ghost block" data-act="back">Back to order</button></div>';
  }

  var PAYMSG = {
    CASH:function(a){return "Please pay "+money(a)+" in cash at the counter.";},
    UPI:function(a){return "Scan the QR code to pay "+money(a)+" via UPI.";},
    CARD:function(a){return "Swipe your card to pay "+money(a)+".";}
  };

  function kitchenHtml(){
    var o = S.current, st = ["PAID","PREPARING","READY"], idx = st.indexOf(o.status);
    var done = o.status==="READY";
    return '<h3>Order #'+o.id+'</h3><p class="muted" style="margin:0">'+PAYMSG[o.mode](o.total)+'</p>'+
      '<div class="status">'+st.map(function(s,i){return '<div class="'+(i<=idx?'on':'')+'">'+s.charAt(0)+s.slice(1).toLowerCase()+'</div>';}).join("")+'</div>'+
      '<p>'+(done?'Order #'+o.id+' is ready. Thank you, '+esc(o.name)+'! Enjoy your meal at table '+o.table+'.':'Kitchen: preparing order #'+o.id+'…')+'</p>'+
      (done?'<div class="actions"><button class="btn block" data-act="next">Serve another customer</button></div>':'');
  }

  function startHtml(){
    var opts = ""; for(var i=1;i<=MAX_TABLES;i++) opts += '<option value="'+i+'">Table '+i+'</option>';
    return '<div class="start"><h2>Welcome to Spice Garden</h2><p class="muted">Tell us who you are and where you’re seated to start ordering.</p>'+
      '<form id="startForm" novalidate><label for="nm">Your name</label><input id="nm" autocomplete="off" required>'+
      '<label for="tb">Table number</label><select id="tb">'+opts+'</select>'+
      '<div class="err" id="startErr">'+esc(S.error)+'</div>'+
      '<button class="btn block" type="submit" style="margin-top:12px">Start ordering</button></form></div>';
  }

  function historyHtml(){
    if(!S.history.length) return '<h2>Order history</h2><p class="empty">No orders today.</p>';
    return '<h2 style="margin-bottom:14px">Order history</h2><div class="scroll"><table><thead><tr><th>Order</th><th>Customer</th><th>Table</th><th>Total</th><th>Paid by</th><th>Status</th></tr></thead><tbody>'+
      S.history.map(function(o){return '<tr><td>#'+o.id+'</td><td>'+esc(o.name)+'</td><td>'+o.table+'</td><td>'+money(o.total)+'</td><td>'+esc(o.mode)+'</td><td>'+esc(o.status)+'</td></tr>';}).join("")+'</tbody></table></div>';
  }

  function render(){
    navBtn.textContent = S.view==="history" ? "Back" : "Order history ("+S.history.length+")";
    if(S.view==="history"){ app.innerHTML = historyHtml(); return; }
    if(S.view==="start"){ app.innerHTML = startHtml(); var n=document.getElementById("nm"); if(n) n.focus(); return; }
    var side = S.stage==="bill" ? billHtml() : S.stage==="kitchen" ? kitchenHtml() : cartHtml();
    var menu = S.stage==="order" ? menuHtml() : "";
    app.innerHTML = '<div class="hello"><h2>Hello '+esc(S.customer.name)+'</h2><p class="muted" style="margin:0">Table '+S.customer.table+' is ready.</p></div>'+
      (S.stage==="order" ? '<div class="layout"><div>'+menu+'</div><aside>'+side+'</aside></div>' : '<div style="max-width:440px"><aside style="position:static">'+side+'</aside></div>');
  }

  function resetOrder(){ S.bill=null; S.picks={}; S.stage="order"; S.error=""; }
  function fail(e){ S.error = e.message; render(); }

  function refreshHistory(){
    return api("/api/history").then(function(h){ S.history = h; render(); }).catch(function(){});
  }

  // The Java kitchen thread moves the order PAID -> PREPARING -> READY; the page just polls.
  function startKitchen(o){
    S.current = o; S.stage = "kitchen"; render();
    (function poll(){
      api("/api/order?orderId="+o.id).then(function(b){
        if(S.current!==o) return;
        o.status = b.status;
        if(S.stage==="kitchen" && S.view!=="history") render();
        if(b.status==="READY") setTimeout(refreshHistory,300); else setTimeout(poll,400);
      }).catch(function(){ if(S.current===o) setTimeout(poll,1000); });
    })();
  }

  app.addEventListener("submit", function(e){
    if(e.target.id!=="startForm") return;
    e.preventDefault();
    var name = document.getElementById("nm").value, table = document.getElementById("tb").value;
    post("/api/order",{name:name,table:table}).then(function(b){
      S.customer={name:b.name,table:b.table}; S.orderId=b.orderId; S.bill=b; S.error=""; S.view="order"; S.stage="order"; S.picks={}; render();
    }).catch(function(err){
      S.error=err.message; var el=document.getElementById("startErr"); if(el) el.textContent=S.error;
    });
  });

  app.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if(!b) return;
    var act = b.dataset.act, id = parseInt(b.dataset.id,10);
    if(act==="inc"){ S.picks[id]=Math.min(20,(S.picks[id]||1)+1); render(); }
    else if(act==="dec"){ S.picks[id]=Math.max(1,(S.picks[id]||1)-1); render(); }
    else if(act==="add"){
      var m = find(id), q = S.picks[id]||1;
      post("/api/order",{orderId:S.orderId,item:id,quantity:q}).then(function(r){
        S.bill=r; S.picks[id]=1; S.error=""; render(); toast("Added "+q+" × "+m.name);
      }).catch(fail);
    }
    else if(act==="rm"){
      api("/api/order?orderId="+S.orderId+"&line="+(parseInt(b.dataset.i,10)+1),{method:"DELETE"}).then(function(r){
        S.bill=r; S.error=""; render();
      }).catch(fail);
    }
    else if(act==="bill"){
      api("/api/bill?orderId="+S.orderId).then(function(r){
        S.bill=r; S.error=""; S.stage="bill"; render();
      }).catch(fail);
    }
    else if(act==="back"){ S.stage="order"; S.error=""; render(); }
    else if(act==="cancel"){
      api("/api/order?orderId="+S.orderId,{method:"DELETE"}).then(function(){
        resetOrder(); S.view="start"; S.customer=null; S.orderId=null; render(); toast("Order cancelled");
      }).catch(fail);
    }
    else if(act==="pay"){
      post("/api/pay",{orderId:S.orderId,mode:b.dataset.mode}).then(function(o){
        S.bill=null; S.error=""; startKitchen(o);
      }).catch(fail);
    }
    else if(act==="next"){ S.customer=null; S.orderId=null; S.current=null; resetOrder(); S.view="start"; render(); }
  });

  navBtn.addEventListener("click", function(){
    if(S.view==="history"){ S.view = S.prev; }
    else { S.prev = S.view; S.view = "history"; refreshHistory(); }
    render();
  });

  api("/api/menu").then(function(m){ MENU = m; render(); }).catch(function(e){ S.error=e.message; render(); });
  refreshHistory();
  render();
})();
</script>
</body>
</html>
